[project]
name = "nylonpay-py"
version = "0.5.1"
description = "Nylon Pay SDK for merchant integrations"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Nile Squad", email = "contact@nilesquad.com" },
]
keywords = ["nylonpay", "nylon-pay", "payments", "mobile-money", "payouts", "fintech", "sdk", "python"]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/nile-squad/nylonpay-py#readme"
Repository = "https://github.com/nile-squad/nylonpay-py"
Issues = "https://github.com/nile-squad/nylonpay-py/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nylonpay"]

[dependency-groups]
dev = [
    "ruff>=0.11",
    "pytest>=8.0",
    "poethepoet>=0.32",
    # 7.0 or newer: twine monkeypatches packaging's valid-metadata list to add
    # Metadata 2.0 support, and 6.x hardcodes it up to 2.4. hatchling now emits
    # Metadata 2.5, so every freshly built artifact was rejected by its own
    # publish step with "'2.5' is not a valid metadata version".
    "twine>=7.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# The signing conformance vectors are exact byte sequences, shared verbatim with
# the TypeScript and PHP SDKs and with the backend, and their expected
# signatures are pinned against them. Wrapping or reformatting a payload string
# would change what gets signed and silently invalidate the vector, so the line
# length rule cannot apply to this file. `ruff format` already leaves them alone
# for the same reason; only the lint rule needed telling.
"tests/unit/test_signing_conformance.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.poe.tasks]
test = "pytest tests/unit tests/security -v"
test-unit = "pytest tests/unit -v"
test-security = "pytest tests/security -v"
test-integration = "pytest tests/integration -v"
typecheck = "uvx ty check"
lint = "ruff check ."
format-check = "ruff format --check ."
lint-fix = "ruff check --fix . && ruff format ."
check = ["lint", "format-check", "typecheck", "test"]
build = "uv build"
# --skip-existing because `uv build` adds to dist/ rather than replacing it, so
# the glob picks up every previously built version too and the upload dies on
# the first one PyPI already has.
publish = ["check", "build", { cmd = "twine upload --skip-existing dist/*.whl dist/*.tar.gz" }]
